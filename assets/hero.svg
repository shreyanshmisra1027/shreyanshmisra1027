<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Shreyansh Misra — Computer Science Engineering</title>
  <desc id="d">Monochrome terminal-style banner with the name SHREYANSH MISRA and the subtitle COMPUTER SCIENCE ENGINEERING.</desc>
  <style>
    .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
    .name{font-size:62px;font-weight:700;letter-spacing:10px;fill:#fff}
    .sub{font-size:20px;letter-spacing:8px;fill:#9a9a9a}
    .prompt{font-size:15px;fill:#6e6e6e}
    .fade{opacity:0;animation:fade 1.2s ease-out forwards}
    .d2{animation-delay:.4s}.d3{animation-delay:.9s}.d4{animation-delay:1.3s}
    .scan{animation:scan 9s linear infinite}
    .cursor{animation:blink 1.1s steps(1) infinite}
    @keyframes fade{to{opacity:1}}
    @keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:.5}90%{opacity:.5}100%{transform:translateY(300px);opacity:0}}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){
      .fade{opacity:1;animation:none}.scan{display:none}.cursor{animation:none}
    }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity="1"/><stop offset=".15" stop-color="#000" stop-opacity="0"/>
      <stop offset=".85" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="#050505"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#edge)"/>
  <rect class="scan" x="0" y="10" width="1200" height="1" fill="#fff" opacity="0"/>

  <!-- terminal title bar -->
  <g class="fade">
    <rect x="40" y="30" width="1120" height="260" rx="6" fill="none" stroke="#2a2a2a"/>
    <line x1="40" y1="64" x2="1160" y2="64" stroke="#2a2a2a"/>
    <circle cx="64" cy="47" r="5" fill="none" stroke="#5a5a5a"/>
    <circle cx="84" cy="47" r="5" fill="none" stroke="#5a5a5a"/>
    <circle cx="104" cy="47" r="5" fill="none" stroke="#5a5a5a"/>
    <text class="mono prompt" x="600" y="52" text-anchor="middle">shreyansh@vit-chennai: ~</text>
  </g>

  <!-- corner brackets -->
  <g class="fade d2" fill="none" stroke="#8a8a8a" stroke-width="1.5">
    <path d="M70 100V88H82"/><path d="M1130 100V88H1118"/>
    <path d="M70 260V272H82"/><path d="M1130 260V272H1118"/>
  </g>

  <text class="mono prompt fade d2" x="90" y="112">$ whoami</text>
  <text class="mono name fade d3" x="600" y="178" text-anchor="middle">SHREYANSH MISRA</text>
  <line class="fade d3" x1="420" y1="202" x2="780" y2="202" stroke="#3a3a3a"/>
  <text class="mono sub fade d4" x="600" y="238" text-anchor="middle">COMPUTER SCIENCE ENGINEERING</text>
  <text class="mono prompt fade d4" x="90" y="266">$ <tspan class="cursor" fill="#fff">█</tspan></text>
  <text class="mono prompt fade d4" x="1110" y="266" text-anchor="end">B.Tech CSE · Cybersecurity · VIT Chennai</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
